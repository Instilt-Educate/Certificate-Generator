<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body onload="hideLoadingText()">
    <div class="header-container">
          <img class="home-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Instilt Logo" />
          <h1 class="home-text">Instilt Batch Hour Certificate Generator</h1>
    </div>

    <div class="nav-container">
        <nav class="horizontal-nav">
            <a href="/">Main Page</a>
            <a href="/generate-pdfs">Generate PDF</a>
            <a href="/send-emails">Send Emails</a>
        </nav>
    </div>

    <div class="content-container">
         <form action="/generate-hour-pdfs" method="POST" onsubmit="showLoadingText()">
            <input type="hidden" name="hours" value="bronze">
            <button type="submit">Bronze (0–49 hours) Certificates</button>
        </form>

        <form action="/generate-hour-pdfs" method="POST" onsubmit="showLoadingText()">
            <input type="hidden" name="hours" value="silver">
            <button type="submit">Silver (50–99 hours) Certificates</button>
        </form>
        <form action="/generate-hour-pdfs" method="POST" onsubmit="showLoadingText()">
            <input type="hidden" name="hours" value="gold">
            <button type="submit">Gold (100–149 hours) Certificates</button>
        </form>
        <form action="/generate-hour-pdfs" method="POST" onsubmit="showLoadingText()">
            <input type="hidden" name="hours" value="platinum">
            <button type="submit">Platinum (150–199 hours) Certificates</button>
        </form>
         <form action="/generate-hour-pdfs" method="POST" onsubmit="showLoadingText()">
            <input type="hidden" name="hours" value="diamond">
            <button type="submit">Diamond (200+ hours) Certificates</button>
        </form>
    </div>
    <div id="loading-text" style="display: none; text-align: center; margin-top: 20px;">
        <p>Generating... Please wait.</p>
    </div>
    <script>
        function showLoadingText() {
            const loadingText = document.getElementById('loading-text');
            loadingText.style.display = 'block'; // Show the loading text
        }

        function hideLoadingText() {
            const loadingText = document.getElementById('loading-text');
            loadingText.style.display = 'none'; // Hide the loading text
        }
    </script>
</body>
</html>
