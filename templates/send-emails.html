<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Emails</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>
<body>
    <div class="header-container">
        <img class="home-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Instilt Logo" />
        <h1 class="home-text">Instilt Hour Certificate Generator</h1>
    </div>

    <div class="nav-container">
        <nav class="horizontal-nav">
            <a href="/">Main Page</a>
            <a href="/generate-pdfs">Generate PDF</a>
            <a href="/send-emails">Send Emails</a>
        </nav>
    </div>

    <div class="content-container">
        <h1 style="margin: 2px">Send Emails</h1>
        <form id="emailForm">
            <div class="form-group">
                <label for="hoursDropdown">Select Hours:</label>
                <select id="hoursDropdown" name="hours">
                    <option value="bronze" selected="selected">Bronze (0–49 hours)</option>
                    <option value="silver">Silver (50–99 hours)</option>
                    <option value="gold">Gold (100–149 hours)</option>
                    <option value="platinum">Platinum (150–199 hours)</option>
                    <option value="diamond">Diamond (200+ hours)</option>
                </select>
            </div>
            <div class="form-group">
                <button type="button" id="fetchDataButton">Fetch Names and Emails</button>
            </div>
            <div class="form-group">
                <label>Names, Emails, and Hours:</label>
                <div class="styled-table-wrapper">
                    <table id="namesEmailsTable" class="styled-table">
                        <colgroup>
                           <col span="1" style="width: 35%;">
                           <col span="1" style="width: 43%;">
                           <col span="1" style="width: 2%;">
                           <col span="1" style="width: 20%;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="name-col">Name</th>
                                <th class="email-col">Email</th>
                                <th class="hour-col">Hours</th>
                                <th class="remove-col">Remove</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows will be added dynamically -->
                        </tbody>
                    </table>
                </div>
                <button type="button" class="add-row-btn" onclick="addRow('', '', '', true)">Add Row</button>
            </div>
            <div class="form-group">
                <button type="button" id="sendEmailButton" onclick="sendEmails()" disabled>Send Emails</button>
            </div>
        </form>
    </div>
    <script>
        function addRow(name = '', email = '', hour = '', editableHour = false) {
            const table = document.getElementById('namesEmailsTable').getElementsByTagName('tbody')[0];
            const row = table.insertRow();
            const nameCell = row.insertCell(0);
            const emailCell = row.insertCell(1);
            const hourCell = row.insertCell(2);
            const removeCell = row.insertCell(3);

            nameCell.innerHTML = `<input type="text" value="${name}" class="input-name">`;
            emailCell.innerHTML = `<input type="text" value="${email}" class="input-email">`;
            hourCell.innerHTML = `<input type="text" value="${hour}" class="input-hour" ${editableHour ? '' : 'readonly'}>`;
            removeCell.innerHTML = `<button type="button" onclick="removeRow(this)" class="remove-btn">Remove</button>`;
            row.classList.add("styled-row");
        }

        function removeRow(btn) {
            const row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }

        document.getElementById('fetchDataButton').addEventListener('click', async function () {
            const selectedHour = document.getElementById('hoursDropdown').value;
            if (!selectedHour) {
                alert('Please select an hour.');
                return;
            }

            try {
                const response = await fetch(`/get-names-emails?hours=${selectedHour}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                const data = await response.json();

                // Clear table
                const tableBody = document.getElementById('namesEmailsTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = '';

                // Populate table (hour field not editable for fetched data)
                for (let i = 0; i < data.names.length; i++) {
                    addRow(
                        data.names[i],
                        data.emails[i] || '',
                        data.hours && data.hours[i] !== undefined ? data.hours[i] : '',
                        false
                    );
                }

                const sendEmailButton = document.getElementById('sendEmailButton');
                sendEmailButton.disabled = data.emails.length === 0;
            } catch (error) {
                alert('Error fetching names and emails: ' + error.message);
                // Clear table
                const tableBody = document.getElementById('namesEmailsTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = '';
            }
        });

        async function sendEmails() {
            const table = document.getElementById('namesEmailsTable').getElementsByTagName('tbody')[0];
            const rows = table.getElementsByTagName('tr');
            const names = [];
            const emails = [];
            for (let i = 0; i < rows.length; i++) {
                const name = rows[i].cells[0].getElementsByTagName('input')[0].value.trim();
                const email = rows[i].cells[1].getElementsByTagName('input')[0].value.trim();
                if (name && email) {
                    names.push(name);
                    emails.push(email);
                }
            }
            const hours = document.getElementById('hoursDropdown').value;

            if (!names.length || !emails.length || !hours) {
                alert('Please ensure names, emails, and hours are provided.');
                return;
            }

            try {
                const response = await fetch('/send-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        names: names,
                        emails: emails,
                        hours: hours
                    }),
                });

                if (!response.ok) {
                    throw new Error('Failed to send emails');
                }

                alert('Emails sent successfully!');
            } catch (error) {
                alert('Error sending emails: ' + error.message);
            }
        }
    </script>
</body>
</html>
