<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generate PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <div class="header-container">
        <img class="home-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Instilt Logo" />
        <h1 class="home-text">Instilt Hour Certificate Generator</h1>
    </div>
    <div class="nav-container">
        <nav class="horizontal-nav">
            <a href="/">Main Page</a>
            <a href="/generate-pdfs">Generate PDF</a>
            <a href="/send-emails">Send Emails</a>
        </nav>
    </div>
    <div class="content-container">
        <h1>Generate and Download PDF</h1>
        {% with messages = get_flashed_messages() %}{% for m in messages %}<p style="color:#8d1a1a">{{ m }}</p>{% endfor %}{% endwith %}
        {% if tiers_error %}<p style="color:#8d1a1a">{{ tiers_error }}</p>{% endif %}
        <form method="POST" action="/generate-pdf">
            <label for="name">Names:</label>
            <br>
            <textarea id="name" name="name" rows="4" cols="50"></textarea>
            <br>
            <label for="hours">Hours:</label>
            <select name="hours" id="hours">
                {% for tier in tiers %}
                <option value="{{ tier.key }}"{% if loop.first %} selected="selected"{% endif %}>{{ tier.label }}</option>
                {% endfor %}
            </select>
            <br>
            <br>
            <input type="submit" value="Generate PDF">
        </form>  
    </div>
</body>
</html>
